name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage Pillow numpy pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "FirestormAccountRegister" firestorm_gui.py

      - name: Package Release Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_dist
          Copy-Item dist\FirestormAccountRegister.exe release_dist\
          Copy-Item config.example.json release_dist\config.json
          Copy-Item accounts.example.txt release_dist\accounts.example.txt
          Compress-Archive -Path release_dist\* -DestinationPath FirestormAccountRegister-Windows.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: |
            FirestormAccountRegister-Windows.zip
            dist/FirestormAccountRegister.exe
          name: Firestorm Account Register Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
